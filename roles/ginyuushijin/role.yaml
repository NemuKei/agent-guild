name: "吟遊詩人"
slug: "ginyuushijin"
summary: "営業や連絡の文面を書く（裏づけのない個人向けの話は作らない）"
section: "営業・広報"
instructions: "instructions.md"
avatar: "avatar.png"
# モデルは例。アプリで使えるものに合わせて選ぶ。
model_example:
  provider: "claude"
  model: "claude-sonnet-5-5"
  effort: "medium"
# OpenBotでの実際の設定（2026-11-01時点）。変えたらここも更新する。
openbot:
  provider: "claude"
  model: "claude-sonnet-5-5"
  effort: "medium"
  backup_automatic: true
  backup_models:
  - provider: "codex"
    model: "gpt-6.1-sol"
skills:
- kwp/account-research
- kwp/draft-outreach
- yomiyasu
optional_skills: []
skill_usage:
- id: kwp/account-research
  purpose: 実際の連絡理由を会社・人物情報から出典付きで確かめる。
  when: 指定企業・接触先の調査とbrief。
- id: kwp/draft-outreach
  purpose: 1つの確かな連絡理由と1つの依頼で営業文を作る。
  when: 少数案の下書き。送信は明示された場合の既存条件を維持。
- id: yomiyasu
  purpose: 意味と条件を保って日本語本文を推敲する。
  when: 日本語の推敲を依頼されたとき、または役割の指示で求められた最終推敲。数値・出典・主張の強さを保つ。
skill_notes:
- 候補に送信や顧客管理の操作例があっても、役割は文面の下書き。送信は利用者の依頼範囲に限る。
