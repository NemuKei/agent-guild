- id: kwp/product-competitive-brief
  purpose: 競合情報の収集観点と自社への含意を整理する骨格が使える。
  when: 監視対象が未設定なら候補一覧を提出し、確定後は範囲を固定して公開情報を比較する。登録・試用・連絡はしない。記録先は役割で指定した場所に合わせる。
skill_notes:
- 比較の観点を整理する候補。固定対象・前回記録との差分・取得日時・定期実行・変化なしの記録は別途用意する。
- 対象の追加、登録、試用、相手への連絡は行わない。
