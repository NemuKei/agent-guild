  when: 日本語の推敲を依頼されたとき、または役割の指示で求められた最終推敲。数値・出典・主張の強さを保つ。
skill_notes:
- 専門知識と引用根拠は提供資料・調査から得る。スキルだけで専門的な事実を補わない。
- 記事と派生短文の下書きまで。公開作業の権限は追加しない。
