skill_usage:
- id: wshobson/code-review-excellence
  purpose: 変更意図とコード・境界条件・テストを確認し、必須指摘と任意提案を区別する一般レビューに適合。
  when: PR/diffレビュー。具体的な再現条件と影響を持つfindingに絞る役割の指示を優先。
- id: openai/security-best-practices
  purpose: 一般reviewからsecurity依頼を明確に切り出した場合に限る。
  when: ユーザーが明示的にsecurityレビューを求め、対象がPython/JS/TS/Goの場合のみ。信頼境界を跨ぐという事情だけでは起動条件を満たさない。
skill_notes:
- security-best-practicesは明示的な安全性レビューの依頼が条件。信頼境界を跨ぐ変更というだけでは自動起動しない。
- 一般レビューでは具体的な根拠・影響・再現条件を持つ指摘に絞る。
