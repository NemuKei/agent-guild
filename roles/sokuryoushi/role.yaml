name: "測量士"
slug: "sokuryoushi"
summary: "検索とAIの答えでの見え方。キーワード、サイトの点検、記事の設計書"
section: "企画・調査"
instructions: "instructions.md"
avatar: "avatar.png"
# モデルは例。アプリで使えるものに合わせて選ぶ。
model_example:
  provider: "claude"
  model: "claude-opus-5-5"
  effort: "high"
# OpenBotでの実際の設定（2026-11-01時点）。変えたらここも更新する。
openbot:
  provider: "claude"
  model: "claude-opus-5-5"
  effort: "high"
  backup_automatic: true
  backup_models:
  - provider: "codex"
    model: "gpt-6.1-sol"
skills:
- marketingskills/seo-audit
- marketingskills/ai-seo
- marketingskills/content-strategy
optional_skills: []
skill_usage:
- id: marketingskills/seo-audit
  purpose: 検索基盤とpage内容を証拠付きで監査。
  when: 指定された公開サイト調査と修正提案のみ。
- id: marketingskills/ai-seo
  purpose: AI回答での引用/表示と抽出しやすさを調べる。
  when: AEO/GEO調査と改善仮説。公開/編集しない。
- id: marketingskills/content-strategy
  purpose: keyword・intent・topic優先度を語り部の記事briefに結び付ける。
  when: 検索用記事企画とbrief。記事本文は語り部。
skill_notes:
- 公開サイトの調査と改善提案・記事の設計書まで。サイト編集・公開は担当外。
- アクセス解析等が未接続なら、検索量・順位・流入の実測値は未確認と明記する。
