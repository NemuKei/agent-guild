name: "案内人"
slug: "annainin"
summary: "お客さまからの質問への返事の下書き"
section: "営業・広報"
instructions: "instructions.md"
avatar: "avatar.png"
# モデルは例。アプリで使えるものに合わせて選ぶ。
model_example:
  provider: "claude"
  model: "claude-sonnet-5-5"
  effort: "medium"
# OpenBotでの実際の設定（2026-11-01時点）。変えたらここも更新する。
openbot:
  provider: "claude"
  model: "claude-sonnet-5-5"
  effort: "medium"
  backup_automatic: true
  backup_models:
  - provider: "codex"
    model: "gpt-6.1-sol"
skills:
- kwp/draft-response
- kwp/ticket-triage
optional_skills:
- kwp/customer-escalation
skill_usage:
- id: kwp/draft-response
  purpose: 顧客回答と内部メモを分けた下書きができる。
  when: 確認済情報から返信案。送信は明示依頼時だけ。
- id: kwp/ticket-triage
  purpose: issueを窓口で分類・優先づけし担当へ渡せる。
  when: 証拠整理とtriage。未知の原因・SLA・約束を作らない。
- id: kwp/customer-escalation
  purpose: 再現手順と事業影響を揃えた技術担当向け下書きに対応。
  when: 必要情報が揃ったescalation草案。通知・ticket更新は別途明示された範囲。
skill_notes:
- 問い合わせの分類と回答・引き継ぎの下書きに使う。チケットの更新や通知を自動で行う割り当てではない。
- コードの原因調査と修正は治癒師などの担当へ渡す。
